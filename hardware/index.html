<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barcode Authenticator</title>
<style>
  :root { --bg: #fafaf7; --fg: #1a1a1a; --muted: #6b6b6b; --ok: #1f8a4c; --bad: #c0392b; --card: #fff; --line: #e4e4de; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141414; --fg: #f2f2f2; --muted: #9a9a9a; --ok: #4cd38a; --bad: #ff6b5b; --card: #1e1e1e; --line: #2c2c2c; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 ui-sans-serif, system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 24px; }
  #pico, #dist { font-size: 14px; color: var(--muted); margin-bottom: 16px; }
  #dist b { color: var(--fg); font-variant-numeric: tabular-nums; }
  #result { padding: 28px 16px; background: var(--card); border: 2px solid var(--line); border-radius: 12px; text-align: center; }
  #result.ok { border-color: var(--ok); } #result.bad { border-color: var(--bad); }
  #verdict { font: 800 36px/1.1 ui-sans-serif, system-ui; }
  #result.ok #verdict { color: var(--ok); } #result.bad #verdict { color: var(--bad); }
  #code { font: 600 22px ui-monospace, monospace; margin-top: 8px; word-break: break-all; }
  #reason { color: var(--muted); font-size: 14px; }
  ul { list-style: none; padding: 0; margin: 24px 0 0; }
  li { font: 14px ui-monospace, monospace; padding: 8px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; }
</style>
</head>
<body>
<main>
  <h1>Barcode Authenticator</h1>
  <p>Click this page once, then scan the barcode on the e-ink screen.</p>
  <div id="pico">checking Pico…</div>
  <div id="dist" hidden>Depth sensor: <b id="distv"></b></div>
  <div id="result"><div id="verdict">waiting for scan…</div><div id="code"></div><div id="reason"></div></div>
  <ul id="log"></ul>
</main>
<script>
  // The scanner is a USB keyboard: it types the code very fast, then presses Enter.
  let buf = "";
  const $ = (id) => document.getElementById(id);
  window.addEventListener("keydown", async (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      const code = buf; buf = "";
      if (!code) return;
      const r = await fetch("/api/verify", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code }) })
        .then((x) => x.json()).catch(() => ({ ok: false, code, reason: "server unreachable" }));
      $("result").className = r.ok ? "ok" : "bad";
      $("verdict").textContent = r.ok ? "ACCESS GRANTED" : "DENIED";
      $("code").textContent = code;
      $("reason").textContent = r.reason;
      const li = document.createElement("li");
      const a = document.createElement("span"), b = document.createElement("span");
      a.textContent = `${r.ok ? "✅" : "❌"} ${code}`; b.textContent = `${r.reason} · ${new Date().toLocaleTimeString()}`;
      li.append(a, b); $("log").prepend(li);
    } else if (e.key.length === 1) {
      buf += e.key;
    }
  });
  async function status() {
    try {
      const s = await fetch("/api/status").then((x) => x.json());
      $("pico").textContent = s.picoConnected ? "Pico connected" : "Pico not connected (plug it in via USB)";
      $("dist").hidden = s.distanceMm == null;
      if (s.distanceMm != null) $("distv").textContent = s.distanceMm >= 2400 ? "nothing within 2.4 m" : `${(s.distanceMm / 10).toFixed(1)} cm`;
    } catch { $("pico").textContent = "server not running"; }
  }
  status(); setInterval(status, 1000);
</script>
</body>
</html>
